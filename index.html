<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tarificatix">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>Tarificatix</title>
<style>
/* ===== FONTS ===== */
@font-face { font-family: 'Font1'; src: url('font1.ttf') format('truetype'); }
@font-face { font-family: 'Font2'; src: url('font2.ttf') format('truetype'); }
@font-face { font-family: 'Font3'; src: url('font3.otf') format('opentype'); }
@font-face { font-family: 'Font4'; src: url('font4.ttf') format('truetype'); }

/* ===== ROOT VARIABLES ===== */
:root {
  --accent-h: 28;
  --accent-s: 90%;
  --accent-l: 55%;
  --accent: hsl(var(--accent-h), var(--accent-s), var(--accent-l));
  --accent-dim: hsl(var(--accent-h), var(--accent-s), 35%);
  --accent-glow: hsl(var(--accent-h), var(--accent-s), 70%);

  --r: 28;
  --g: 90;
  --b: 55;

  --title-font: 'Font1', Georgia, serif;
  --body-font: Arial, Helvetica, sans-serif;

  /* DARK MODE (default) */
  --bg: #111214;
  --bg2: #1a1c1f;
  --bg3: #222428;
  --surface: #1e2024;
  --surface2: #272a2f;
  --border: #33363d;
  --text: #e8eaed;
  --text-dim: #8a8f9a;
  --text-muted: #555a66;
  --shadow: rgba(0,0,0,0.5);
  --input-bg: #161819;
  --card-shadow: 0 2px 12px rgba(0,0,0,0.4);
}

[data-theme="light"] {
  --bg: #f0f2f5;
  --bg2: #e8ebef;
  --bg3: #dde0e6;
  --surface: #ffffff;
  --surface2: #f5f7fa;
  --border: #d0d4dc;
  --text: #1a1c22;
  --text-dim: #4a5060;
  --text-muted: #8a90a0;
  --shadow: rgba(0,0,0,0.12);
  --input-bg: #f8f9fb;
  --card-shadow: 0 2px 12px rgba(0,0,0,0.08);
}

/* ===== RESET ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--body-font);
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  line-height: 1.5;
  transition: background 0.3s, color 0.3s;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ===== LAYOUT ===== */
.app-wrapper {
  max-width: 520px;
  margin: 0 auto;
  padding: 0 0 env(safe-area-inset-bottom, 16px);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

/* ===== HEADER ===== */
header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: clamp(10px, 3vw, 16px) clamp(14px, 4vw, 20px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.header-left {
  flex: 1;
}

.header-center {
  flex: 1;
  display: flex;
  justify-content: center;
}

.header-right {
  flex: 1;
  display: flex;
  justify-content: flex-end;
}

.app-title {
  font-family: var(--title-font);
  font-size: clamp(1.4rem, 6vw, 1.9rem);
  color: var(--accent);
  letter-spacing: -0.02em;
  line-height: 1;
  font-weight: normal;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.icon-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 10px;
  width: clamp(38px, 10vw, 44px);
  height: clamp(38px, 10vw, 44px);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: clamp(0.7rem, 2.5vw, 0.8rem);
  font-family: var(--body-font);
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
  -webkit-user-select: none;
  user-select: none;
}
.icon-btn:active { background: var(--bg3); transform: scale(0.96); }

/* ===== MAIN CONTENT ===== */
main {
  flex: 1;
  padding: clamp(14px, 4vw, 20px);
  display: flex;
  flex-direction: column;
  gap: clamp(14px, 3vw, 18px);
}

/* ===== CARD ===== */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: clamp(14px, 4vw, 20px);
  box-shadow: var(--card-shadow);
}

.card-title {
  font-family: var(--title-font);
  font-size: clamp(0.85rem, 3vw, 1rem);
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-weight: normal;
  margin-bottom: clamp(12px, 3vw, 16px);
}

/* ===== TARIF SELECTOR ===== */
.tarif-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: clamp(14px, 3vw, 18px);
}

.tarif-btn {
  background: var(--surface2);
  border: 2px solid var(--border);
  border-radius: 12px;
  padding: clamp(10px, 2.5vw, 14px) 4px;
  cursor: pointer;
  text-align: center;
  transition: all 0.15s;
  color: var(--text);
  font-family: var(--body-font);
  -webkit-user-select: none;
  user-select: none;
}
.tarif-btn:active { transform: scale(0.95); }
.tarif-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.tarif-btn-label {
  font-weight: 800;
  font-size: clamp(1rem, 4vw, 1.2rem);
  line-height: 1;
  display: block;
}
.tarif-btn-price {
  font-size: clamp(0.65rem, 2.2vw, 0.78rem);
  opacity: 0.75;
  margin-top: 3px;
  display: block;
}
.tarif-btn.active .tarif-btn-price { opacity: 0.9; }

/* ===== DISTANCE INPUT ===== */
.input-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.input-group {
  flex: 1;
  position: relative;
}

.input-label {
  font-size: clamp(0.72rem, 2.3vw, 0.82rem);
  color: var(--text-dim);
  margin-bottom: 6px;
  display: block;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.distance-input {
  width: 100%;
  background: var(--input-bg);
  border: 2px solid var(--border);
  border-radius: 12px;
  padding: clamp(12px, 3vw, 16px) clamp(14px, 3.5vw, 18px);
  font-size: clamp(1.1rem, 4vw, 1.3rem);
  font-family: var(--body-font);
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
  -webkit-appearance: none;
  appearance: none;
}
.distance-input:focus { border-color: var(--accent); }
.distance-input::placeholder { color: var(--text-muted); }

.unit-badge {
  color: var(--text-dim);
  font-size: clamp(0.8rem, 2.8vw, 0.9rem);
  font-weight: 600;
  white-space: nowrap;
}

/* ===== CALCULATE BUTTON ===== */
.calc-btn {
  width: 100%;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 14px;
  padding: clamp(14px, 4vw, 18px);
  font-family: var(--title-font);
  font-size: clamp(1rem, 4vw, 1.2rem);
  letter-spacing: 0.06em;
  cursor: pointer;
  transition: all 0.15s;
  margin-top: clamp(6px, 2vw, 10px);
  font-weight: normal;
}
.calc-btn:active { transform: scale(0.98); filter: brightness(0.9); }
.calc-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

/* ===== RESULT ===== */
.result-display {
  display: none;
  flex-direction: column;
  gap: 6px;
}
.result-display.visible { display: flex; }

.result-main {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.result-price {
  font-family: var(--title-font);
  font-size: clamp(2rem, 10vw, 3rem);
  color: var(--accent);
  font-weight: normal;
  line-height: 1;
}

.result-detail {
  font-size: clamp(0.72rem, 2.3vw, 0.82rem);
  color: var(--text-dim);
  line-height: 1.8;
  text-align: right;
}

.add-to-list-btn {
  background: var(--surface2);
  border: 2px solid var(--border);
  border-radius: 12px;
  padding: clamp(10px, 3vw, 14px);
  font-family: var(--body-font);
  font-size: clamp(0.82rem, 2.8vw, 0.92rem);
  color: var(--text);
  cursor: pointer;
  transition: all 0.15s;
  text-align: center;
  font-weight: 600;
  letter-spacing: 0.03em;
}
.add-to-list-btn:active { background: var(--bg3); transform: scale(0.98); }

/* ===== COURSES LIST ===== */
.courses-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: clamp(10px, 2.5vw, 14px);
  flex-wrap: wrap;
  gap: 8px;
}

.courses-total {
  font-family: var(--title-font);
  font-size: clamp(1rem, 4vw, 1.2rem);
  color: var(--accent);
  font-weight: normal;
}

.clear-btn {
  background: none;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 12px;
  font-size: clamp(0.7rem, 2.2vw, 0.78rem);
  color: var(--text-dim);
  cursor: pointer;
  font-family: var(--body-font);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  font-weight: 600;
  transition: all 0.15s;
}
.clear-btn:active { background: var(--bg3); }

.courses-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.course-item {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: clamp(10px, 2.8vw, 14px) clamp(12px, 3.2vw, 16px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  animation: slideIn 0.2s ease;
}
@keyframes slideIn {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: translateY(0); }
}

.course-item-left { flex: 1; min-width: 0; }
.course-item-num {
  font-size: clamp(0.65rem, 2vw, 0.72rem);
  color: var(--text-muted);
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-bottom: 2px;
}
.course-item-info {
  font-size: clamp(0.8rem, 2.6vw, 0.88rem);
  color: var(--text-dim);
}
.course-item-info strong { color: var(--text); }

.course-item-price {
  font-family: var(--title-font);
  font-size: clamp(1.1rem, 4.5vw, 1.35rem);
  color: var(--text);
  font-weight: normal;
  white-space: nowrap;
}

.course-delete {
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: clamp(0.72rem, 2.3vw, 0.8rem);
  cursor: pointer;
  padding: 4px 6px;
  border-radius: 6px;
  font-family: var(--body-font);
  font-weight: 700;
  transition: color 0.15s;
  letter-spacing: 0.04em;
  flex-shrink: 0;
}
.course-delete:active { color: #e55; }

.empty-list {
  text-align: center;
  padding: clamp(16px, 5vw, 24px);
  color: var(--text-muted);
  font-size: clamp(0.8rem, 2.6vw, 0.9rem);
}

/* ===== TOTAL BAR ===== */
.total-bar {
  position: sticky;
  bottom: 0;
  background: var(--bg);
  border-top: 1px solid var(--border);
  padding: clamp(12px, 3vw, 16px) clamp(14px, 4vw, 20px);
  padding-bottom: calc(clamp(12px, 3vw, 16px) + env(safe-area-inset-bottom, 0px));
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.total-label {
  font-size: clamp(0.72rem, 2.3vw, 0.82rem);
  color: var(--text-dim);
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.total-amount {
  font-family: var(--title-font);
  font-size: clamp(1.5rem, 7vw, 2rem);
  color: var(--accent);
  font-weight: normal;
  line-height: 1;
}

/* ===== SETTINGS OVERLAY ===== */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  align-items: flex-end;
  justify-content: center;
}
.overlay.open { display: flex; }

.settings-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 24px 24px 0 0;
  padding: clamp(16px, 4vw, 24px);
  width: 100%;
  max-width: 520px;
  max-height: 90dvh;
  overflow-y: auto;
  animation: slideUp 0.25s ease;
}
@keyframes slideUp {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.settings-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: clamp(18px, 4vw, 24px);
}

.settings-title {
  font-family: var(--title-font);
  font-size: clamp(1.1rem, 5vw, 1.4rem);
  color: var(--accent);
  font-weight: normal;
}

.close-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 8px;
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 0.8rem;
  font-weight: 700;
  font-family: var(--body-font);
  letter-spacing: 0.04em;
}
.close-btn:active { background: var(--bg3); }

.settings-section {
  margin-bottom: clamp(20px, 4vw, 26px);
}

.settings-section-label {
  font-size: clamp(0.7rem, 2.3vw, 0.78rem);
  color: var(--text-muted);
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: clamp(10px, 2.5vw, 14px);
}

/* ===== THEME TOGGLE ===== */
.theme-toggle {
  display: flex;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 4px;
  gap: 4px;
}

.theme-opt {
  flex: 1;
  text-align: center;
  padding: clamp(8px, 2.5vw, 11px);
  border-radius: 8px;
  cursor: pointer;
  font-size: clamp(0.78rem, 2.5vw, 0.86rem);
  font-weight: 600;
  color: var(--text-dim);
  transition: all 0.15s;
  border: none;
  background: none;
  font-family: var(--body-font);
}
.theme-opt.active {
  background: var(--accent);
  color: #fff;
}
.theme-opt:active { transform: scale(0.97); }

/* ===== COLOR SLIDERS ===== */
.rgb-sliders { display: flex; flex-direction: column; gap: clamp(10px, 2.5vw, 14px); }

.slider-row { display: flex; align-items: center; gap: 10px; }

.slider-label {
  font-size: clamp(0.72rem, 2.3vw, 0.8rem);
  font-weight: 700;
  width: 24px;
  flex-shrink: 0;
  color: var(--text);
}
.slider-label.r { color: #ff4444; }
.slider-label.g { color: #44cc44; }
.slider-label.b { color: #4488ff; }

.color-slider {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 6px;
  border-radius: 3px;
  outline: none;
  cursor: pointer;
}
.color-slider.r { background: linear-gradient(to right, #220000, #ff4444); }
.color-slider.g { background: linear-gradient(to right, #002200, #44cc44); }
.color-slider.b { background: linear-gradient(to right, #000022, #4488ff); }

.color-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #fff;
  border: 3px solid var(--accent);
  cursor: pointer;
  box-shadow: 0 1px 4px rgba(0,0,0,0.4);
}

.slider-val {
  font-size: clamp(0.7rem, 2.2vw, 0.78rem);
  color: var(--text-dim);
  width: 28px;
  text-align: right;
  flex-shrink: 0;
  font-weight: 600;
}

.accent-preview {
  width: 100%;
  height: clamp(32px, 7vw, 40px);
  border-radius: 10px;
  margin-top: 10px;
  transition: background 0.1s;
}

/* ===== FONT SELECTOR ===== */
.font-grid {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.font-opt {
  background: var(--surface2);
  border: 2px solid var(--border);
  border-radius: 12px;
  padding: clamp(10px, 3vw, 14px) clamp(12px, 3.5vw, 16px);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  transition: all 0.15s;
  border: none;
  width: 100%;
  text-align: left;
  border: 2px solid var(--border);
}
.font-opt.active {
  border-color: var(--accent);
  background: var(--bg3);
}
.font-opt:active { transform: scale(0.99); }

.font-opt-name {
  font-family: var(--body-font);
  font-size: clamp(0.72rem, 2.3vw, 0.8rem);
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-weight: 700;
}
.font-opt-preview {
  font-size: clamp(1.1rem, 4vw, 1.35rem);
  color: var(--text);
}
.font-opt-preview.f1 { font-family: 'Font1', Georgia, serif; }
.font-opt-preview.f2 { font-family: 'Font2', 'Times New Roman', serif; }
.font-opt-preview.f3 { font-family: 'Font3', Palatino, serif; }
.font-opt-preview.f4 { font-family: 'Font4', Garamond, serif; }
.font-opt.active .font-opt-preview { color: var(--accent); }

.font-indicator {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--border);
  flex-shrink: 0;
  transition: background 0.15s;
}
.font-opt.active .font-indicator { background: var(--accent); }

/* ===== DIVIDER ===== */
.divider {
  height: 1px;
  background: var(--border);
  margin: clamp(4px, 1.5vw, 8px) 0 clamp(18px, 4vw, 24px);
}

/* ===== BOTTOM NAV ===== */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 520px;
  background: var(--bg);
  border-top: 1px solid var(--border);
  display: flex;
  z-index: 150;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.nav-tab {
  flex: 1;
  background: none;
  border: none;
  color: var(--text-muted);
  font-family: var(--body-font);
  font-size: clamp(0.62rem, 2vw, 0.72rem);
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: clamp(10px, 2.5vw, 14px) 4px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  transition: color 0.15s;
  -webkit-user-select: none;
  user-select: none;
}
.nav-tab .nav-icon { font-size: clamp(1.1rem, 3.5vw, 1.3rem); line-height: 1; }
.nav-tab.active { color: var(--accent); }
.nav-tab:active { opacity: 0.7; }

/* ===== PAGE SYSTEM ===== */
.page { display: none; flex: 1; flex-direction: column; }
.page.active { display: flex; }
.app-wrapper { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 60px); }

/* ===== DESTINATIONS PAGE ===== */
.dest-toolbar {
  padding: clamp(10px, 3vw, 14px) clamp(14px, 4vw, 20px) 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.dest-search {
  width: 100%;
  background: var(--input-bg);
  border: 2px solid var(--border);
  border-radius: 12px;
  padding: clamp(10px, 2.5vw, 13px) clamp(12px, 3vw, 16px);
  font-size: clamp(0.88rem, 3vw, 0.96rem);
  font-family: var(--body-font);
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
  -webkit-appearance: none;
  appearance: none;
}
.dest-search:focus { border-color: var(--accent); }
.dest-search::placeholder { color: var(--text-muted); }
.dest-filter-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.dest-filter-btn {
  background: var(--surface2);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 5px 12px;
  font-size: clamp(0.68rem, 2.2vw, 0.76rem);

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// ===== STATE =====
const BASE_FEE = 3.00;
const TARIFS = { A: 1.10, B: 1.65, C: 2.20, D: 3.30 };

let state = {
  selectedTarif: 'A',
  selectedRate: 1.10,
  currentResult: null,
  courses: [],
  theme: 'dark',
  accentR: 220,
  accentG: 110,
  accentB: 30,
  titleFont: 'Font1'
};

// ===== INIT =====
function init() {
  const saved = localStorage.getItem('tarificatix_state');
  if (saved) {
    try {
      const s = JSON.parse(saved);
      state.courses = s.courses || [];
      state.theme = s.theme || 'dark';
      state.accentR = s.accentR ?? 220;
      state.accentG = s.accentG ?? 110;
      state.accentB = s.accentB ?? 30;
      state.titleFont = s.titleFont || 'Font1';
    } catch(e) {}
  }
  applyTheme(state.theme);
  applyAccent();
  applyFont(state.titleFont);
  renderCourses();
  syncSettingsUI();
}

function saveState() {
  localStorage.setItem('tarificatix_state', JSON.stringify({
    courses: state.courses,
    theme: state.theme,
    accentR: state.accentR,
    accentG: state.accentG,
    accentB: state.accentB,
    titleFont: state.titleFont
  }));
}

// ===== TARIF =====
function selectTarif(btn) {
  document.querySelectorAll('.tarif-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  state.selectedTarif = btn.dataset.tarif;
  state.selectedRate = parseFloat(btn.dataset.rate);
  hideResult();
}

// ===== CALCULATE =====
function calculate() {
  const dist = parseFloat(document.getElementById('distanceInput').value);
  if (isNaN(dist) || dist <= 0) {
    document.getElementById('distanceInput').focus();
    return;
  }

  // La prise en charge (3€) n'est appliquée qu'à la toute première course
  const isFirst = state.courses.length === 0;
  const fee = isFirst ? BASE_FEE : 0;
  const fare = state.selectedRate * dist;
  const total = fee + fare;

  state.currentResult = {
    tarif: state.selectedTarif,
    rate: state.selectedRate,
    distance: dist,
    fee: fee,
    fare: fare,
    total: total,
    isFirst: isFirst
  };

  const r = state.currentResult;
  document.getElementById('resultPrice').textContent = formatEur(r.total);

  let detail = `Tarif ${r.tarif}  ×  ${r.distance.toFixed(1)} km = ${formatEur(r.fare)}`;
  if (r.isFirst) detail += `\nPrise en charge : ${formatEur(BASE_FEE)}`;

  document.getElementById('resultDetail').textContent = detail;
  document.getElementById('resultDisplay').classList.add('visible');
}

function hideResult() {
  document.getElementById('resultDisplay').classList.remove('visible');
  state.currentResult = null;
}

// ===== ADD TO LIST =====
function addToList() {
  if (!state.currentResult) return;
  state.courses.push({ ...state.currentResult, id: Date.now() });
  state.currentResult = null;
  document.getElementById('distanceInput').value = '';
  document.getElementById('resultDisplay').classList.remove('visible');
  renderCourses();
  saveState();
}

// ===== RENDER COURSES =====
function renderCourses() {
  const list = document.getElementById('coursesList');
  const emptyMsg = document.getElementById('emptyMsg');
  const totalBar = document.getElementById('totalBar');
  const totalAmount = document.getElementById('totalAmount');
  const coursesTotal = document.getElementById('coursesTotal');

  // Vider uniquement les items de course, sans toucher à emptyMsg
  Array.from(list.children).forEach(child => {
    if (child !== emptyMsg) child.remove();
  });

  if (state.courses.length === 0) {
    emptyMsg.style.display = '';
    totalBar.style.display = 'none';
    totalAmount.textContent = '0,00 €';
    coursesTotal.textContent = '';
    return;
  }

  emptyMsg.style.display = 'none';

  let grand = 0;
  state.courses.forEach((c, i) => {
    grand += c.total;
    const item = document.createElement('div');
    item.className = 'course-item';
    item.innerHTML = `
      <div class="course-item-left">
        <div class="course-item-num">Course ${i + 1}${c.isFirst ? ' (prise en charge incluse)' : ''}</div>
        <div class="course-item-info">
          Tarif <strong>${c.tarif}</strong> &mdash; <strong>${c.distance.toFixed(1)} km</strong>
        </div>
      </div>
      <span class="course-item-price">${formatEur(c.total)}</span>
      <button class="course-delete" onclick="deleteCourse(${c.id})">SUP</button>
    `;
    list.appendChild(item);
  });

  const n = state.courses.length;
  coursesTotal.textContent = `${n} course${n > 1 ? 's' : ''}`;
  totalAmount.textContent = formatEur(grand);
  totalBar.style.display = 'flex';
}

function deleteCourse(id) {
  const idx = state.courses.findIndex(c => c.id === id);
  if (idx === -1) return;

  const deletingFirst = state.courses[idx].isFirst;
  state.courses.splice(idx, 1);

  // Si on supprimait la première course (avec prise en charge),
  // on la transfère à la nouvelle première course
  if (deletingFirst && state.courses.length > 0) {
    const nf = state.courses[0];
    nf.isFirst = true;
    nf.fee = BASE_FEE;
    nf.total = nf.fare + BASE_FEE;
  }

  renderCourses();
  saveState();
}

function clearCourses() {
  state.courses = [];
  hideResult();
  renderCourses();
  saveState();
}

// ===== THEME =====
function applyTheme(t) {
  document.body.dataset.theme = t;
  state.theme = t;
  document.getElementById('darkOpt').classList.toggle('active', t === 'dark');
  document.getElementById('lightOpt').classList.toggle('active', t === 'light');
}

function setTheme(t) { applyTheme(t); saveState(); }



// ===== ACCENT COLOR =====
function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b);
  let h, s, l = (max+min)/2;
  if (max === min) { h = s = 0; }
  else {
    const d = max - min;
    s = l > 0.5 ? d/(2-max-min) : d/(max+min);
    switch(max) {
      case r: h = ((g-b)/d + (g<b?6:0))/6; break;
      case g: h = ((b-r)/d + 2)/6; break;
      case b: h = ((r-g)/d + 4)/6; break;
    }
  }
  return [Math.round(h*360), Math.round(s*100), Math.round(l*100)];
}

function applyAccent() {
  const [h, s, l] = rgbToHsl(state.accentR, state.accentG, state.accentB);
  const lClamped = Math.max(35, Math.min(65, l));
  document.documentElement.style.setProperty('--accent-h', h);
  document.documentElement.style.setProperty('--accent-s', s + '%');
  document.documentElement.style.setProperty('--accent-l', lClamped + '%');
  document.getElementById('accentPreview').style.background =
    `rgb(${state.accentR},${state.accentG},${state.accentB})`;
}

function updateRGB() {
  state.accentR = parseInt(document.getElementById('sliderR').value);
  state.accentG = parseInt(document.getElementById('sliderG').value);
  state.accentB = parseInt(document.getElementById('sliderB').value);
  document.getElementById('valR').textContent = state.accentR;
  document.getElementById('valG').textContent = state.accentG;
  document.getElementById('valB').textContent = state.accentB;
  applyAccent();
  saveState();
}

// ===== FONT =====
function applyFont(f) {
  state.titleFont = f;
  document.documentElement.style.setProperty('--title-font', `'${f}', Georgia, serif`);
}

function selectFont(btn) {
  document.querySelectorAll('.font-opt').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFont(btn.dataset.font);
  saveState();
}

// ===== SETTINGS =====
function openSettings() { document.getElementById('settingsOverlay').classList.add('open'); }
function closeSettings() { document.getElementById('settingsOverlay').classList.remove('open'); }

document.getElementById('settingsBtn').addEventListener('click', openSettings);
document.getElementById('settingsOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeSettings();
});

function syncSettingsUI() {
  // Theme
  applyTheme(state.theme);
  // Sliders
  document.getElementById('sliderR').value = state.accentR;
  document.getElementById('sliderG').value = state.accentG;
  document.getElementById('sliderB').value = state.accentB;
  document.getElementById('valR').textContent = state.accentR;
  document.getElementById('valG').textContent = state.accentG;
  document.getElementById('valB').textContent = state.accentB;
  applyAccent();
  // Font
  document.querySelectorAll('.font-opt').forEach(b => {
    b.classList.toggle('active', b.dataset.font === state.titleFont);
  });
  applyFont(state.titleFont);
}

// ===== UTILS =====
function formatEur(n) {
  return n.toFixed(2).replace('.', ',') + ' \u20AC';
}

// Enter key to calculate
document.getElementById('distanceInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') calculate();
});


// ===== TAB NAVIGATION =====
function switchTab(tab) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  if (tab === 'calc') {
    document.getElementById('pageCalc').classList.add('active');
    document.getElementById('navCalc').classList.add('active');
  } else {
    document.getElementById('pageDestinations').classList.add('active');
    document.getElementById('navDest').classList.add('active');
    if (!destState.loaded && !destState.loading) loadDestinations();
  }
}

// ===== DESTINATIONS STATE =====
const TARIFS_KM = { A: 1.10, B: 1.65, C: 2.20, D: 3.30 };
const destState = {
  data: [],
  filtered: [],
  loaded: false,
  loading: false,
  tarif: 'A',
  pec: false,
  search: '',
  sortCol: 'dest',
  sortDir: 'asc'
};

// ===== LOAD EXCEL =====
async function loadDestinations() {
  destState.loading = true;
  const wrap = document.getElementById('destTableWrap');
  wrap.innerHTML = '<div class="dest-loading"><div class="dest-loading-spinner"></div>Chargement des destinations…</div>';

  try {
    const resp = await fetch('Tableau_tarif.xlsx');
    if (!resp.ok) throw new Error(`Fichier introuvable (${resp.status})`);
    const buf = await resp.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });

    destState.data = rows.map(r => {
      const keys = Object.keys(r);
      const dest = r[keys[0]] ?? '';
      const km   = parseFloat(r[keys[1]]) || null;
      const peage = parseFloat(r[keys[2]]) || 0;
      return { dest: String(dest).trim(), km, peage };
    }).filter(r => r.dest && r.dest !== '-');

    destState.loaded = true;
    destState.loading = false;
    applyDestFilter();
  } catch(e) {
    destState.loading = false;
    wrap.innerHTML = `<div class="dest-error">
      <strong>Impossible de charger le fichier Excel.</strong><br>
      Vérifiez que <code>Tableau_tarif.xlsx</code> est bien dans le même dossier que ce fichier HTML.<br><br>
      <em>Détail : ${e.message}</em>
    </div>`;
  }
}

// ===== FILTER & SORT =====
function applyDestFilter() {
  let d = [...destState.data];
  const q = destState.search.toLowerCase().trim();
  if (q) d = d.filter(r => r.dest.toLowerCase().includes(q));

  // Sort
  d.sort((a, b) => {
    let va, vb;
    if (destState.sortCol === 'dest')  { va = a.dest; vb = b.dest; }
    else if (destState.sortCol === 'km') { va = a.km ?? -1; vb = b.km ?? -1; }
    else if (destState.sortCol === 'peage') { va = a.peage; vb = b.peage; }
    else { va = calcPrice(a); vb = calcPrice(b); }
    if (va < vb) return destState.sortDir === 'asc' ? -1 : 1;
    if (va > vb) return destState.sortDir === 'asc' ? 1 : -1;
    return 0;
  });

  destState.filtered = d;
  document.getElementById('destCount').textContent = `${d.length} destination${d.length > 1 ? 's' : ''}`;
  renderDestTable();
}

function calcPrice(row) {
  if (!row.km) return null;
  return TARIFS_KM[destState.tarif] * row.km + row.peage + (destState.pec ? BASE_FEE : 0);
}

function setDestTarif(btn) {
  document.querySelectorAll('.dest-tarif-chip').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  destState.tarif = btn.dataset.tarif;
  applyDestFilter();
}

function setDestPec(btn) {
  document.querySelectorAll('.dest-filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  destState.pec = btn.dataset.pec === 'true';
  applyDestFilter();
}

function filterDestinations() {
  destState.search = document.getElementById('destSearch').value;
  applyDestFilter();
}

function sortBy(col) {
  if (destState.sortCol === col) {
    destState.sortDir = destState.sortDir === 'asc' ? 'desc' : 'asc';
  } else {
    destState.sortCol = col;
    destState.sortDir = 'asc';
  }
  applyDestFilter();
}

// ===== RENDER TABLE =====
function renderDestTable() {
  const wrap = document.getElementById('destTableWrap');
  const d = destState.sortDir;
  const c = destState.sortCol;
  const arrow = (col) => `<span class="sort-arrow ${c===col ? d : ''}">${c===col ? (d==='asc'?'▲':'▼') : '⇅'}</span>`;

  if (destState.filtered.length === 0) {
    wrap.innerHTML = `<div class="dest-loading" style="color:var(--text-muted)">Aucune destination trouvée</div>`;
    return;
  }

  let rows = '';
  for (const row of destState.filtered) {
    const km   = row.km !== null ? row.km.toLocaleString('fr-FR', {maximumFractionDigits:1}) + ' km' : '—';
    const prix = row.km ? formatEur(calcPrice(row)) : '—';
    const badge = row.peage > 0
      ? `<span class="peage-badge oui">⚠ ${row.peage.toLocaleString('fr-FR', {maximumFractionDigits:0})} €</span>`
      : `<span class="peage-badge non">Non</span>`;
    rows += `<tr onclick="openDestModal(${JSON.stringify(row.dest).replace(/'/g,"&#39;")})">
      <td class="col-dest">${row.dest}</td>
      <td class="col-km">${km}</td>
      <td class="col-peage">${badge}</td>
      <td class="col-price">${prix}</td>
    </tr>`;
  }

  wrap.innerHTML = `<table class="dest-table">
    <thead>
      <tr>
        <th class="sortable" onclick="sortBy('dest')">Destination ${arrow('dest')}</th>
        <th class="sortable" onclick="sortBy('km')">Km ${arrow('km')}</th>
        <th class="sortable" onclick="sortBy('peage')">Péage ${arrow('peage')}</th>
        <th class="sortable col-price" onclick="sortBy('price')">Prix (tarif ${destState.tarif}) ${arrow('price')}</th>
      </tr>
    </thead>
    <tbody>${rows}</tbody>
  </table>`;
}

// ===== DETAIL MODAL =====
function openDestModal(destName) {
  const row = destState.data.find(r => r.dest === destName);
  if (!row) return;

  document.getElementById('destModalTitle').textContent = row.dest;
  document.getElementById('destModalSub').textContent = 'Détail des tarifs depuis Sablé';

  const km = row.km !== null ? row.km.toLocaleString('fr-FR', {maximumFractionDigits:1}) + ' km' : '—';
  document.getElementById('destModalGrid').innerHTML = `
    <div class="dest-modal-cell">
      <div class="dest-modal-cell-label">Distance</div>
      <div class="dest-modal-cell-val">${km}</div>
    </div>
    <div class="dest-modal-cell">
      <div class="dest-modal-cell-label">Péage</div>
      <div class="dest-modal-cell-val">${row.peage > 0 ? row.peage.toLocaleString('fr-FR', {maximumFractionDigits:0}) + ' €' : 'Aucun'}</div>
    </div>`;

  let prices = '';
  for (const [t, rate] of Object.entries(TARIFS_KM)) {
    const p = row.km ? formatEur(rate * row.km + row.peage + (destState.pec ? BASE_FEE : 0)) : '—';
    const current = t === destState.tarif ? ' current' : '';
    prices += `<div class="dest-modal-price-cell${current}">
      <span class="dest-modal-price-letter">${t}</span>
      <span class="dest-modal-price-amount">${p}</span>
    </div>`;
  }
  document.getElementById('destModalPrices').innerHTML = prices;
  document.getElementById('destModalOverlay').classList.add('open');
}

function closeDestModal(e) {
  if (!e || e.target === document.getElementById('destModalOverlay') || !e.target) {
    document.getElementById('destModalOverlay').classList.remove('open');
  }
}

// ===== START =====
init();
</script>
